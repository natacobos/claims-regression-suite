# Runs the API and the test suite without installing .NET or browsers.
#   docker compose up -d api          API and page on http://localhost:5080
#   docker compose run --rm tests     run the whole suite (starts the API if needed)
services:
  api:
    image: mcr.microsoft.com/playwright/dotnet:v1.49.0-noble
    working_dir: /src/api
    command: dotnet run --urls http://0.0.0.0:5080
    ports:
      - "5080:5080"
    volumes:
      - .:/src
      - api-bin:/src/api/bin
      - api-obj:/src/api/obj
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/5080"]
      interval: 3s
      retries: 60

  tests:
    image: mcr.microsoft.com/playwright/dotnet:v1.49.0-noble
    working_dir: /src/tests
    command: dotnet test
    profiles: ["tests"]
    environment:
      BASE_URL: http://api:5080
    volumes:
      - .:/src
      - tests-bin:/src/tests/bin
      - tests-obj:/src/tests/obj
      - nuget:/root/.nuget/packages
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-bin:
  api-obj:
  tests-bin:
  tests-obj:
  nuget:
